# H2 database configuration
# During development use the url localhost:8080/h2-console
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tells the compiler from where to run h2's seeding script
spring.sql.init.data-locations=classpath:scripts/data.sql

# Disables flyway for this profile
spring.flyway.enabled=false