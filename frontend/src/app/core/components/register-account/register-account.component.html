<mat-card class="card default-background-color2 default-text-color" appearance="outlined">
    <mat-card-content>

        <h4>Register</h4>

        <form class="flex-column form-gap" [formGroup]="registerForm">
            <div class="flex-column">
                <label for="name">First Name</label>
                <input id="name" type="email" formControlName="firstName" name="firstName">
            </div>

            <div class="flex-column">
                <label for="email">Email</label>
                <input id="email" type="email" formControlName="email" name="email">
            </div>

            <div class="flex-column">
                <label for="password">Password</label>
                <input id="password" type="password" formControlName="password" name="password">
            </div>

            <button *ngIf="!isRegisterExecuting" class="width-100 button" (click)="registerAccount()">Register</button>
            <app-loading-spinner *ngIf="isRegisterExecuting" [message]="'Registering...'"></app-loading-spinner>
        </form>

        <mat-divider class="divider"></mat-divider>
        <p class="login-option">Already registered?<a [routerLink]="'/login'">Login</a></p>
    </mat-card-content>

</mat-card>
